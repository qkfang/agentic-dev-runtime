name: Orchestrate Development

on:
  workflow_dispatch:
    inputs:
      app_idea:
        description: 'App idea and description'
        required: false
        type: string
      features:
        description: 'Features to implement (one per line)'
        required: false
        type: string

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Update requirements
        if: ${{ inputs.app_idea != '' }}
        run: |
          {
            echo "# Project Requirements"
            echo ""
            echo "## App Idea"
            echo "${{ inputs.app_idea }}"
            echo ""
            echo "## Features"
            echo "${{ inputs.features }}"
          } > workspace/requirements.md

      - name: Create issues for open scopes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in workspace/scopes/*.md; do
            [ -f "$f" ] || continue
            scope_id=$(python3 scripts/parse_scope.py "$f" scope_id)
            title=$(python3 scripts/parse_scope.py "$f" title)
            status=$(python3 scripts/parse_scope.py "$f" status)
            [ "$status" = "open" ] || continue
            count=$(gh issue list --search "[$scope_id] in:title" --state open --json number --jq 'length' 2>/dev/null || echo "0")
            [ "${count:-0}" -gt 0 ] && continue
            gh issue create \
              --title "[$scope_id] $title" \
              --body "$(cat "$f")" \
              --label "copilot" || true
          done

      - name: Update progress
        run: python3 scripts/update_progress.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add workspace/
          git diff --staged --quiet || git commit -m "chore: update requirements and progress [skip ci]"
          git push
